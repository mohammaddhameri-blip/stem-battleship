name: Build STEAM Battleship APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'audio-engine.js'
      - 'question-ms.js'
      - 'rbt-questions.js'
      - 'naval-theme.css'
      - 'naval-scene.svg'
      - 'manifest.webmanifest'
      - 'icons/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-battleship-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout game and Android app
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK without obsolete tools package
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing key for in-place APK updates
        id: debug-keystore-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: steam-battleship-debug-keystore-v1

      - name: Bundle current game for offline local play
        run: |
          mkdir -p android/app/src/main/assets/game
          cp index.html audio-engine.js question-ms.js rbt-questions.js naval-theme.css naval-scene.svg manifest.webmanifest android/app/src/main/assets/game/
          cp -R icons android/app/src/main/assets/game/
          test -s android/app/src/main/assets/game/index.html
          test -s android/app/src/main/assets/game/audio-engine.js
          test -s android/app/src/main/assets/game/question-ms.js
          test -s android/app/src/main/assets/game/naval-theme.css
          test -s android/app/src/main/assets/game/rbt-questions.js

      - name: Generate monotonically increasing Android version code
        run: |
          # Every successful Actions build receives a higher installable version.
          # VersionCode is independent of the game's browser/cache version.
          APK_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          APK_VERSION_NAME=$(sed -n "s/.*const VERSION_FALLBACK='\\([^']*\\)'.*/\\1/p" index.html | head -n 1)
          if [ -z "$APK_VERSION_NAME" ]; then
            echo "Could not read app version from index.html"
            exit 1
          fi
          sed -i -E "s/versionCode [0-9]+/versionCode ${APK_VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '${APK_VERSION_NAME}'/" android/app/build.gradle
          echo "APK_VERSION_CODE=$APK_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_VERSION_NAME=$APK_VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building Android v$APK_VERSION_NAME (code $APK_VERSION_CODE)"

      - name: Compile installable debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Cache signing key for future app upgrades
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: steam-battleship-debug-keystore-v1

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk STEAM-Battleship.apk
          ls -lh STEAM-Battleship.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: STEAM-Battleship-Android-APK
          path: STEAM-Battleship.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct-download APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" STEAM-Battleship.apk --clobber
          else
            gh release create "$TAG" STEAM-Battleship.apk \
              --target "$GITHUB_SHA" \
              --title "STEAM Battleship Android (latest)" \
              --notes "Release metadata pending" \
              --prerelease
          fi
          # Publish update metadata last: clients can only see a new version code
          # after the matching APK asset has finished uploading.
          gh release edit "$TAG" --notes "APK_VERSION_CODE=${APK_VERSION_CODE}
          APK_VERSION_NAME=${APK_VERSION_NAME}

          Installable Android test APK. Responsive portrait/landscape gameplay,
          latest online game and bundled offline version. Android 8+.
          The app checks this release on launch and asks before downloading an update."
