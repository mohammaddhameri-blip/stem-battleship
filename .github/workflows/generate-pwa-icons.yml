name: Generate PWA Icons
on:
  push:
    branches: [main]
    paths:
      - 'icons/steam-battleship.svg'
      - '.github/workflows/generate-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Render SVG into iOS and Android home-screen PNGs
        run: |
          python3 -m venv /tmp/steam-icon-env
          /tmp/steam-icon-env/bin/pip install --disable-pip-version-check --quiet cairosvg
          /tmp/steam-icon-env/bin/python - <<'PY'
          import cairosvg
          for size in [180, 192, 512]:
              output = f'icons/icon-{size}.png'
              cairosvg.svg2png(url='icons/steam-battleship.svg', write_to=output,
                                output_width=size, output_height=size)
              print(f'Created {output}')
          PY
      - name: Commit generated PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-180.png icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate PNG icons for iPhone and Android PWA"
            git push
          fi
