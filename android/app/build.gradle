plugins {
    id 'com.android.application'
}

android {
    namespace 'my.mrdhameri.steambattleship'
    compileSdk 35

    defaultConfig {
        applicationId 'my.mrdhameri.steambattleship'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '3.08'
    }

    // Never use an automatically generated, runner-specific debug signing key.
    // GitHub Actions restores this exact keystore before compiling. Its
    // certificate must match the previously published APK or the job fails.
    signingConfigs {
        debug {
            storeFile file(System.getenv('STEM_APK_KEYSTORE') ?: (System.getenv('HOME') + '/.android/debug.keystore'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
