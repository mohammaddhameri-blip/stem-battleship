plugins {
    id 'com.android.application'
}

android {
    namespace 'my.mrdhameri.steambattleship'
    compileSdk 35

    defaultConfig {
        applicationId 'my.mrdhameri.steambattleship'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '3.08'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
